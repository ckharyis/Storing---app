databases:
  - name: lending-portal-db
    plan: free
    databaseName: lending_portal
    user: lending_portal

services:
  - type: web
    name: lending-application-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py bootstrap_demo_owner
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DEMO_MODE
        value: true
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lending-portal-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRED
        value: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_BASE_URL
        sync: false
      - key: PUBLIC_BRAND_NAME
        sync: false
      - key: BUSINESS_LEGAL_NAME
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_REGISTRATION_NUMBER
        sync: false
      - key: LENDER_AUTHORIZATION_REFERENCE
        sync: false
      - key: BUSINESS_CONTACT_EMAIL
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: IP_HASH_KEY
        generateValue: true
